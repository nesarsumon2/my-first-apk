name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android Project Structure
        run: |
          echo "Verifying project structure..."
          # Check Android project root (current directory should have settings.gradle.kts or build.gradle.kts)
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            echo "Error: Android project root not found (missing settings.gradle.kts/build.gradle)" >&2
            exit 1
          fi

          # Check Gradle wrapper
          if [ ! -f "gradlew" ]; then
            echo "Error: Gradle wrapper (gradlew) not found" >&2
            exit 1
          fi

          # Check application module directory
          if [ ! -d "app" ] || [ ! -f "app/build.gradle.kts" ]; then
            echo "Error: Application module 'app' or its build.gradle.kts not found" >&2
            exit 1
          fi
          echo "Project structure verification passed successfully!"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Give Gradle wrapper permission to run
        run: chmod +x gradlew

      - name: Remove stale project-level Gradle and application build caches
        run: |
          echo "Removing build caches..."
          rm -rf .gradle build app/build

      - name: Generate Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Locate and Verify Generated APK
        run: |
          echo "Locating generated APK..."
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" -print -quit)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No valid APK file was generated or found!" >&2
            exit 1
          fi
          if [ ! -f "$APK_FILE" ]; then
            echo "Error: Located APK path '$APK_FILE' is not a valid file!" >&2
            exit 1
          fi
          echo "Successfully verified APK file at: $APK_FILE"
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: ${{ env.APK_PATH }}
